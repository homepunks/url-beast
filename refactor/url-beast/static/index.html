<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>url_beast</title>
<style>
  :root { --bg:#282828; --bg1:#3c3836; --fg:#ebdbb2; --gray:#928374;
          --yellow:#fabd2f; --green:#b8bb26; --aqua:#8ec07c; --red:#fb4934; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:grid; place-items:center; padding:1rem;
         background:var(--bg); color:var(--fg);
         font:15px/1.6 ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; }
  main { width:100%; max-width:36rem; }
  h1 { font-size:1rem; color:var(--yellow); }
  h1::before { content:"$ "; color:var(--gray); }
  p { color:var(--gray); margin-bottom:1rem; }
  form { display:flex; border:1px solid var(--bg1); }
  form::before { content:">"; padding:.6rem; color:var(--aqua); }
  input { flex:1; min-width:0; padding:.6rem 0; font:inherit; color:var(--fg);
          background:none; border:0; outline:0; }
  button { font:inherit; padding:.6rem .9rem; border:0; cursor:pointer;
           background:var(--bg1); color:var(--fg); }
  button:hover { background:var(--yellow); color:var(--bg); }
  #out { margin-top:1rem; min-height:1.6rem; word-break:break-all; }
  #out a { color:var(--green); }
  #out .err { color:var(--red); }
  #out button { margin-left:.75rem; padding:0 .5rem; }
</style>

<main>
  <h1>url_beast</h1>
  <p># long link in, short link out</p>
  <form id="f"><input id="u" type="url" placeholder="https://..." required autofocus><button>shorten</button></form>
  <div id="out"></div>
</main>

<script>
const out = document.getElementById("out");
const el = (tag, props) => Object.assign(document.createElement(tag), props);

document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const u = document.getElementById("u");
  try {
    const res = await fetch("/new", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ old_link: u.value }),
    });
    const data = await res.json();
    if (!res.ok) return out.replaceChildren(el("span", { className: "err", textContent: "error: " + data.error }));
    const link = data.new_link;
    const copy = el("button", { textContent: "copy", onclick: () => {
      navigator.clipboard.writeText(link);
      copy.textContent = "ok";
    }});
    out.replaceChildren("→ ", el("a", { href: link, textContent: link, target: "_blank" }), copy);
    u.value = "";
  } catch {
    out.replaceChildren(el("span", { className: "err", textContent: "error: server unreachable" }));
  }
};
</script>
